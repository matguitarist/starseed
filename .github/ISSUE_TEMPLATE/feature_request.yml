name: Feature request
description: An idea to make Starseed better.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: English or French is fine. / L'anglais ou le français, c'est parfait.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The situation or problem, more than the solution.
      placeholder: "When I switch between two farms, I have to…"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Starseed help?
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Other mod managers that do it well, screenshots, mockups…
