# XcodeGen spec — regenerate the Xcode project with:  xcodegen generate
# (The generated StardewModManager.xcodeproj is checked in too, so XcodeGen
# is only needed when adding targets or changing build settings.)
name: StardewModManager
options:
  bundleIdPrefix: local.stardew-mod-manager
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Localization: string literals in SwiftUI views and String(localized:)
    # are extracted into App/Localizable.xcstrings (English + French).
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "2.1.1"
    CURRENT_PROJECT_VERSION: "2"
packages:
  ModManagerCore:
    path: ModManagerCore
  # Self-updates for the app (see "Releasing updates" in the README).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  StardewModManager:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: ModManagerCore
      - package: Sparkle
    # A locally ("ad-hoc") signed app with the hardened runtime can't load
    # separately signed frameworks (Sparkle) without this.
    entitlements:
      path: App/StardewModManager.entitlements
      properties:
        com.apple.security.cs.disable-library-validation: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Starseed
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        LSApplicationCategoryType: public.app-category.games
        # App updates (Sparkle): release.sh publishes the zip on GitHub
        # Releases and the feed (appcast.xml) on the main branch. The key
        # checks that updates were signed with the private key in the
        # maintainer's Keychain (account "starseed").
        SUFeedURL: https://raw.githubusercontent.com/matguitarist/starseed/main/appcast.xml
        SUPublicEDKey: +PIE3ai3I8a18/RsdsdSorvcunqfx8FyfoJexeOYjWk=
        SUEnableAutomaticChecks: true
        NSHumanReadableCopyright: ""
        # Receive Nexus "Mod Manager Download" links.
        CFBundleURLTypes:
          - CFBundleURLName: Nexus Mods download link
            CFBundleURLSchemes: [nxm]
            CFBundleTypeRole: Viewer
        # Let users open/drop mod archives onto the app icon.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Mod Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive, org.7-zip.7-zip-archive, com.rarlab.rar-archive]
    settings:
      base:
        PRODUCT_NAME: Starseed
        PRODUCT_BUNDLE_IDENTIFIER: local.stardew-mod-manager
        PRODUCT_MODULE_NAME: StardewModManager
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ad-hoc "Sign to Run Locally" by default. With an ad-hoc signature,
        # macOS asks for Keychain access again after every rebuild; signing with
        # an Apple Development team (DEVELOPMENT_TEAM=XXXXXXXXXX ./build_app.sh)
        # keeps the app's identity stable so it only asks once.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        # No App Sandbox: the app manages the game's Mods folder anywhere on disk.
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  StardewModManager:
    build:
      targets:
        StardewModManager: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: ModManagerCore/ModManagerCoreTests
    archive:
      config: Release
